<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 206" width="1200" height="206" role="img" aria-labelledby="title desc">
<title id="title">Foreman at a glance</title>
<desc id="desc">3 hooks catch, remind and re-brief. 6 probe types prove what is built. 1 Python file, standard library only. 0 dependencies and no API keys. 2 minutes to install with one command. Messages in Russian and English.</desc>
<style>
  .h1 { font: 700 34px Georgia, 'Times New Roman', Times, serif; fill: #2E1E15; }
